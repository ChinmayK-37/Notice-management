server:
  port: 8080

# Browser CORS (Flutter web). Add patterns (e.g. http://192.168.0.5:*) for LAN web debugging.
app:
  cors:
    allowed-origin-patterns:
      - "http://localhost:*"
      - "http://127.0.0.1:*"
  # Demo: include notices expired within the last N days in student feeds (0 = hide all expired).
  notice:
    expiry-grace-days: 7

spring:
  application:
    name: notice
  datasource:
    url: jdbc:postgresql://localhost:5432/college_notice
    username: postgres
    password: root
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: very-long-secret-key-at-least-32-characters-strong
  access-token-expiration-ms: 3600000
  refresh-token-expiration-ms: 86400000
management:
  endpoints:
    web:
      exposure:
        include: mappings